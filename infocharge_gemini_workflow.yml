name: INFOCHARGE Gemini Market Updates

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Update type for manual test"
        required: true
        default: "hourly"
        type: choice
        options:
          - morning
          - premarket
          - open
          - hourly
          - close
          - evening
          - global
          - holiday

  schedule:
    # Holiday / weekend briefings — 00:00, 06:00, 12:00, 18:00 IST
    - cron: "30 18 * * *"
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"

    # Trading-day updates — IST converted to UTC
    - cron: "0 2 * * 1-5"    # 07:30 IST
    - cron: "15 3 * * 1-5"   # 08:45 IST
    - cron: "50 3 * * 1-5"   # 09:20 IST

    - cron: "30 4 * * 1-5"   # 10:00 IST
    - cron: "30 5 * * 1-5"   # 11:00 IST
    - cron: "30 6 * * 1-5"   # 12:00 IST
    - cron: "30 7 * * 1-5"   # 13:00 IST
    - cron: "30 8 * * 1-5"   # 14:00 IST
    - cron: "30 9 * * 1-5"   # 15:00 IST

    - cron: "15 10 * * 1-5"  # 15:45 IST
    - cron: "0 13 * * 1-5"   # 18:30 IST
    - cron: "0 16 * * 1-5"   # 21:30 IST

jobs:
  market-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide update type
        id: type
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.update_type }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CRON="${{ github.event.schedule }}"

          case "$CRON" in
            "30 18 * * *"|"30 0 * * *"|"30 6 * * *"|"30 12 * * *")
              echo "kind=holiday" >> "$GITHUB_OUTPUT"
              ;;
            "0 2 * * 1-5")
              echo "kind=morning" >> "$GITHUB_OUTPUT"
              ;;
            "15 3 * * 1-5")
              echo "kind=premarket" >> "$GITHUB_OUTPUT"
              ;;
            "50 3 * * 1-5")
              echo "kind=open" >> "$GITHUB_OUTPUT"
              ;;
            "15 10 * * 1-5")
              echo "kind=close" >> "$GITHUB_OUTPUT"
              ;;
            "0 13 * * 1-5")
              echo "kind=evening" >> "$GITHUB_OUTPUT"
              ;;
            "0 16 * * 1-5")
              echo "kind=global" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "kind=hourly" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run INFOCHARGE Gemini bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFOCHARGE_UPDATE_TYPE: ${{ steps.type.outputs.kind }}
        run: python bot_gemini.py
