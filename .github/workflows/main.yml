name: INFOCHARGE AI Market Intelligence

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Manual test type"
        required: true
        default: premarket
        type: choice
        options:
          - premarket
          - open
          - hourly
          - close
          - evening

  schedule:
    # 08:30 IST
    - cron: "0 3 * * 1-5"

    # 09:10 IST
    - cron: "40 3 * * 1-5"

    # 10:30 IST
    - cron: "0 5 * * 1-5"

    # 12:30 IST
    - cron: "0 7 * * 1-5"

    # 14:30 IST
    - cron: "0 9 * * 1-5"

    # 15:40 IST
    - cron: "10 10 * * 1-5"

    # 18:30 IST
    - cron: "0 13 * * 1-5"


jobs:
  market-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gemini.txt

      - name: Decide update type
        id: update_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.update_type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "kind=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "0 3 * * 1-5")
                echo "kind=premarket" >> "$GITHUB_OUTPUT"
                ;;
              "40 3 * * 1-5")
                echo "kind=open" >> "$GITHUB_OUTPUT"
                ;;
              "10 10 * * 1-5")
                echo "kind=close" >> "$GITHUB_OUTPUT"
                ;;
              "0 13 * * 1-5")
                echo "kind=evening" >> "$GITHUB_OUTPUT"
                ;;
