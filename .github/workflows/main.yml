name: INFOCHARGE Gemini Market Updates

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Update type"
        required: true
        default: "hourly"
        type: choice
        options:
          - morning
          - premarket
          - open
          - hourly
          - close
          - evening
          - global
          - holiday

  schedule:
    - cron: "0 0 * * *"
    - cron: "0 2 * * 1-5"
    - cron: "15 3 * * 1-5"
    - cron: "50 3 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "0 18 * * *"

jobs:
  market-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements_gemini.txt

      - name: Decide update type
        id: type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.update_type }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 0 * * *"|"0 6 * * *"|"0 12 * * *"|"0 18 * * *")
                echo "kind=holiday" >> "$GITHUB_OUTPUT"
                ;;
              "0 2 * * 1-5")
                echo "kind=morning" >> "$GITHUB_OUTPUT"
                ;;
              "15 3 * * 1-5")
                echo "kind=premarket" >> "$GITHUB_OUTPUT"
                ;;
              "50 3 * * 1-5")
                echo "kind=open" >> "$GITHUB_OUTPUT"
                ;;
              "15 10 * * 1-5")
                echo "kind=close" >> "$GITHUB_OUTPUT"
                ;;
              "0 13 * * 1-5")
                echo "kind=evening" >> "$GITHUB_OUTPUT"
                ;;
              "0 16 * * 1-5")
                echo "kind=global" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "kind=hourly" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Run INFOCHARGE Gemini Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFOCHARGE_UPDATE_TYPE: ${{ steps.type.outputs.kind }}
        run: python bot_gemini.py
