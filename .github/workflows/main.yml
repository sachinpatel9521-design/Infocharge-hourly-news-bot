name: INFOCHARGE AI Market Intelligence

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Manual test type"
        required: true
        default: hourly
        type: choice
        options:
          - premarket
          - open
          - hourly
          - close
          - evening
          - education
          - motivation
          - macro
          - ipo

  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "40 3 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "10 10 * * 1-5"
    - cron: "0 13 * * 1-5"

jobs:
  market-update:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gemini.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile bot_gemini.py

      - name: Run INFOCHARGE AI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFOCHARGE_UPDATE_TYPE: "${{ github.event_name == 'workflow_dispatch' && inputs.update_type || github.event.schedule == '0 3 * * 1-5' && 'premarket' || github.event.schedule == '40 3 * * 1-5' && 'open' || github.event.schedule == '10 10 * * 1-5' && 'close' || github.event.schedule == '0 13 * * 1-5' && 'evening' || 'hourly' }}"
        run: |
          python bot_gemini.py

      - name: Save editorial memory
        shell: bash
        run: |
          if git diff --quiet -- infocharge_memory.json; then
            echo "No memory changes."
            exit 0
          fi

          git config user.name "INFOCHARGE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add infocharge_memory.json
          git commit -m "Update INFOCHARGE editorial memory"
          git push
