name: INFOCHARGE Gemini Market Updates

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Choose update type for a manual test"
        required: true
        default: hourly
        type: choice
        options:
          - morning
          - premarket
          - open
          - hourly
          - close
          - evening
          - global
          - holiday

  schedule:
    # 00:00, 06:00, 12:00, 18:00 IST
    - cron: "30 18 * * *"
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"

    # Trading-day schedule (UTC)
    - cron: "0 2 * * 1-5"
    - cron: "15 3 * * 1-5"
    - cron: "50 3 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 16 * * 1-5"

jobs:
  market-update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements_gemini.txt

      - name: Decide update type
        id: update_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.update_type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "kind=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "30 18 * * *"|"30 0 * * *"|"30 6 * * *"|"30 12 * * *")
                echo "kind=holiday" >> "$GITHUB_OUTPUT"
                ;;
              "0 2 * * 1-5")
                echo "kind=morning" >> "$GITHUB_OUTPUT"
                ;;
              "15 3 * * 1-5")
                echo "kind=premarket" >> "$GITHUB_OUTPUT"
                ;;
              "50 3 * * 1-5")
                echo "kind=open" >> "$GITHUB_OUTPUT"
                ;;
              "15 10 * * 1-5")
                echo "kind=close" >> "$GITHUB_OUTPUT"
                ;;
              "0 13 * * 1-5")
                echo "kind=evening" >> "$GITHUB_OUTPUT"
                ;;
              "0 16 * * 1-5")
                echo "kind=global" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "kind=hourly" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Run INFOCHARGE Gemini Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INFOCHARGE_UPDATE_TYPE: ${{ steps.update_type.outputs.kind }}
        run: python bot_gemini.py
