name: INFOCHARGE AI Market Intelligence

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Manual test type"
        required: true
        default: hourly
        type: choice
        options:
          - premarket
          - open
          - hourly
          - close
          - evening
          - education
          - motivation
          - macro
          - ipo

  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "40 3 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "10 10 * * 1-5"
    - cron: "0 13 * * 1-5"

jobs:
  market-update:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_gemini.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile bot_gemini.py

      - name: Decide update type
        id: update_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.update_type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "kind=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          elif [[ "$SCHEDULE" == "0 3 * * 1-5" ]]; then
            echo "kind=premark
