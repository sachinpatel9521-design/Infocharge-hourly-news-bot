name: INFOCHARGE AI Market Intelligence

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: "Manual test type"
        required: true
        default: premarket
        type: choice
        options:
          - premarket
          - open
          - hourly
          - close
          - evening

  schedule:
    # 08:30 IST - Pre-market
    - cron: "0 3 * * 1-5"

    # 09:10 IST - Before market open
    - cron: "40 3 * * 1-5"

    # 10:30 IST - Intelligent check
    - cron: "0 5 * * 1-5"

    # 12:30 IST - Intelligent check
    - cron: "0 7 * * 1-5"

    # 14:30 IST - Intelligent check
    - cron: "0 9 * * 1-5"

    # 15:40 IST - Closing intelligence
    - cron: "10 10 * * 1-5"

    # 18:30 IST - Evening important-news check
    - cron: "0 13 * * 1-5"

jobs:
  market-update:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements_gemini.txt

      - name: Decide update type
        id: update_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.update_type }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "kind=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "0 3 * * 1-5")
                echo "kind=premarket" >> "$GITHUB_OUTPUT"
                ;;
              "40 3 * * 1-5")
                echo "kind=open" >> "$GITHUB_OUTPUT"
                ;;
              "10 10 * * 1-5")
                echo "kind=close" >> "$GITHUB_OUTPUT"
                ;;
              "0 13 * * 1-5")
                echo "kind=evening" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "kind=hourly" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Run INFOCHARGE AI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEM
